<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Store{% endblock %} – {{ company }}</title>
<style>
:root{--navy:#14324a;--accent:#1f5f8b;--ink:#1c2733;--muted:#5d6b78;--line:#dde3e9;--bg:#f4f6f8;--ok:#1d7a4a}
*{box-sizing:border-box}
body{margin:0;font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:var(--bg)}
header{background:var(--navy);color:#fff}
header .in{max-width:1120px;margin:0 auto;padding:16px 24px;display:flex;align-items:center;justify-content:space-between}
header a{color:#fff;text-decoration:none;font-weight:600}
header small{opacity:.75;font-weight:400}
main{max-width:1120px;margin:0 auto;padding:32px 24px 56px}
h1{font-size:30px;margin:0 0 6px;color:var(--navy)}
h2{font-size:22px;margin:40px 0 4px;color:var(--navy)}
.lead{color:var(--muted);margin:0 0 8px;max-width:720px}
.plans{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px;margin-top:18px}
.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:22px;display:flex;flex-direction:column}
.card.free{background:#fafbfc}
.card h3{margin:0;font-size:18px}
.price{font-size:32px;font-weight:700;color:var(--navy);margin:10px 0 0}
.price small{font-size:14px;font-weight:400;color:var(--muted)}
.limits{list-style:none;padding:0;margin:16px 0 20px;flex:1}
.limits li{padding:7px 0;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:12px}
.limits b{white-space:nowrap}
.btn{display:inline-block;background:var(--accent);color:#fff;border:0;border-radius:6px;padding:10px 18px;font:inherit;font-weight:600;text-decoration:none;text-align:center;cursor:pointer}
.btn:hover{background:var(--navy)}
.btn.ghost{background:#fff;color:var(--accent);border:1px solid var(--accent)}
.btn[disabled],.btn.off{background:#c9d2da;color:#fff;cursor:default}
.note{color:var(--muted);font-size:13px}
.panel{background:#fff;border:1px solid var(--line);border-radius:10px;padding:26px;max-width:620px}
.row{margin-bottom:16px}
label{display:block;font-weight:600;margin-bottom:4px}
input[type=text],input[type=email]{width:100%;padding:9px 11px;border:1px solid #b9c4ce;border-radius:6px;font:inherit}
.help{color:var(--muted);font-size:13px;margin-top:3px}
.err{color:#b42318;font-size:13px;margin-top:3px}
.summary{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:18px}
.steps{padding-left:20px}
.steps li{margin:6px 0}
footer{color:var(--muted);font-size:13px;text-align:center;padding:24px}
a{color:var(--accent)}
.summary + .limits li:first-child{border-top:0}
</style>
</head>
<body>
<header><div class="in"><a href="{% url 'store' %}">{{ company }} <small>Store</small></a><a href="mailto:{{ support }}"><small>{{ support }}</small></a></div></header>
<main>{% block content %}{% endblock %}</main>
<footer>Prices in US dollars, billed yearly. Payments are handled by Paddle, our reseller, who also issues the invoice.<br>
Questions? <a href="mailto:{{ support }}">{{ support }}</a></footer>
{% block scripts %}{% endblock %}
</body>
</html>
