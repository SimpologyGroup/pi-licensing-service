[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "pi-license"
version = "0.1.0"
description = "Shared licence certificate checks for the PI apps"
requires-python = ">=3.11"
dependencies = ["cryptography>=43"]

[tool.setuptools]
packages = ["pi_license"]
